name: Build Luqta unsigned

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'dependency-lock.json'
      - '.github/workflows/build-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools and compiler
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          curl --fail --location --retry 3 --output ecj.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar
      - name: Build aligned APK
        run: python3 scripts/build.py --sdk "$ANDROID_HOME" --ecj ecj.jar --unsigned-output
      - name: Collect signing utility
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" outputs/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: luqta-unsigned-build
          path: |
            outputs/Luqta-Android-unsigned-aligned.apk
            outputs/apksigner.jar
          retention-days: 3
          if-no-files-found: error
